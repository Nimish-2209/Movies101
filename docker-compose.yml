services:
  web:
    build: ./web
  films:
    build: ./films
    depends_on:
      - db
    environment:
      MONGO_DB_URI: mongodb://db:27017/mydb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
  db:
    image: mongo:7.0-jammy
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo7_data:/data/db
  nginx:
    image: nginx@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    ports:
      - "8080:8080"
    volumes:
      - ./web/public:/srv/www/static
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - films

volumes:
  mongo7_data:
