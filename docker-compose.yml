services:
  web:
    build: ./web
  films:
    build: ./films
    stop_grace_period: 15s
    depends_on:
      - db
    environment:
      MONGO_DB_URI: mongodb://db:27017/mydb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      TRUST_PROXY_HOPS: 1
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-granite4.1:3b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-60000}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-5}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-60000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  db:
    image: mongo:7.0-jammy
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo7_data:/data/db
  nginx:
    image: nginx@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    ports:
      - '8080:8080'
    volumes:
      - ./web/public:/srv/www/static
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - films

volumes:
  mongo7_data:
